---
- name: Gestionar servicio Middleware Demo
  hosts: ubuntu
  become: true
  gather_facts: false

  tasks:

    - name: Mostrar acción solicitada
      ansible.builtin.debug:
        msg: "Acción solicitada: {{ service_action }}"

    - name: Iniciar servicio
      ansible.builtin.command:
        cmd: systemctl start middleware-demo
      when: service_action == "START"

    - name: Detener servicio
      ansible.builtin.command:
        cmd: systemctl stop middleware-demo
      when: service_action == "STOP"

    - name: Reiniciar servicio
      ansible.builtin.command:
        cmd: systemctl restart middleware-demo
      when: service_action == "RESTART"

    - name: Obtener estado del servicio
      ansible.builtin.command:
        cmd: systemctl is-active middleware-demo
      register: service_status
      changed_when: false

    - name: Mostrar estado
      ansible.builtin.debug:
        msg: "Servicio middleware-demo: {{ service_status.stdout }}"
