---
- name: Diagnostico Semaphore
  hosts: ubuntu
  become: true
  gather_facts: false

  tasks:

    - name: Mostrar usuario efectivo
      ansible.builtin.command:
        cmd: id
      register: identidad

    - name: Mostrar identidad
      ansible.builtin.debug:
        var: identidad.stdout

    - name: Mostrar usuario
      ansible.builtin.command:
        cmd: whoami
      register: usuario

    - name: Mostrar usuario
      ansible.builtin.debug:
        var: usuario.stdout

    - name: Probar sudo
      ansible.builtin.command:
        cmd: id
      become: true
      register: identidad_root

    - name: Mostrar identidad sudo
      ansible.builtin.debug:
        var: identidad_root.stdout
